# Triển khai một node — SYSTEM.md §4.2, §9.5.
#
# Mọi service PHẢI có healthcheck và `depends_on: condition: service_healthy`:
# `api` gọi `inference` ngay lúc khởi động (warmup BGE-M3 mất hàng chục giây), nếu chỉ
# `depends_on` trần thì api lên trước khi model nạp xong và request đầu tiên chết.
#
#   docker compose up -d db redis      # B1: hạ tầng nền
#   docker compose up -d --build       # đầy đủ

name: audio-security-rag

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?phai dat POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-audio_security}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -U/-d tường minh: pg_isready mặc định dùng user `root` trong container này và
      # báo healthy SAI trước khi database của ta thực sự sẵn sàng.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asr} -d ${POSTGRES_DB:-audio_security}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      # Image mlflow không có curl; dùng python có sẵn trong image.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  inference:
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    environment:
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      EMBED_DIM: ${EMBED_DIM:-1024}
      ONTOLOGY_PATH: /config/ontology_map.yaml
      AUDIOSET_ONTOLOGY: /config/audioset_ontology.json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8001:8001"
    volumes:
      - ./ml/configs/ontology_map.yaml:/config/ontology_map.yaml:ro
      - ./data/reference/audioset_ontology.json:/config/audioset_ontology.json:ro
      # Cache model: BGE-M3 ~2.2 GB + checkpoint PANNs ~300 MB. Không có volume này thì
      # mỗi lần dựng lại container là tải lại từ đầu.
      - model_cache:/models
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-asr}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-audio_security}
      REDIS_URL: redis://redis:6379/0
      INFERENCE_URL: http://inference:8001
      EMBED_DIM: ${EMBED_DIM:-1024}
      RAG_ANSWER_PROVIDER: ${RAG_ANSWER_PROVIDER:-template}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      AUDIO_RETENTION_DAYS: ${AUDIO_RETENTION_DAYS:-30}
      AUDIO_DIR: /data/event_audio
      ONTOLOGY_PATH: /config/ontology_map.yaml
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    volumes:
      # Mount READ-ONLY: taxonomy là nguồn chân lý duy nhất, service chỉ được đọc.
      - ./ml/configs/ontology_map.yaml:/config/ontology_map.yaml:ro
      - event_audio:/data/event_audio
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # CỐ Ý chỉ `service_started`, KHÔNG phải `service_healthy`: lần chạy đầu inference
      # mất vài phút tải model. Chờ nó healthy nghĩa là dashboard và /events cũng chết
      # theo suốt thời gian đó, dù chúng không cần model. /health của api báo trạng thái
      # inference riêng, và upload sẽ lỗi rõ ràng nếu gọi sớm.
      inference:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      # Chỉ `service_started`: nginx proxy tới api lúc có request, không phải lúc khởi
      # động. Bắt chờ api healthy chỉ làm dashboard lên chậm mà không được gì.
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  mlflow_data:
  event_audio:
  model_cache:
