# File này được include vào khối `http` của nginx, nên `map` đặt ở đây là hợp lệ.
# Không có map này thì $connection_upgrade rỗng và WebSocket bị hạ xuống HTTP thường —
# kết nối mở được nhưng không bao giờ nhận được bản tin nào.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Header an ninh cơ bản. CSP không có 'unsafe-inline' cho script: Vite dựng ra file
    # .js riêng, không nhét script vào HTML, nên không cần mở.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Asset có hash trong tên nên cache vĩnh viễn được; index.html thì KHÔNG, nếu không
    # trình duyệt sẽ giữ bản cũ và trỏ tới file .js đã bị xoá sau mỗi lần triển khai.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Proxy về service api. Nhờ vậy dashboard và API cùng một origin: không cần CORS,
    # không cần biến base-URL lúc dựng, và WebSocket cũng đi chung đường.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Nâng cấp WebSocket cho /api/v1/alerts/stream.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Cảnh báo là kết nối im lặng dài: mặc định 60s sẽ ngắt liên tục khi không có
        # sự kiện nào, và dashboard cứ nối lại vô ích.
        proxy_read_timeout 3600s;

        # Upload wav có thể tới 100 MB (MAX_UPLOAD_BYTES phía api).
        client_max_body_size 100m;
    }

    # SPA: mọi đường dẫn không phải file thật đều trả index.html để react-router xử lý.
    # Thiếu dòng này thì F5 ở /events/EVT_... ra 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
