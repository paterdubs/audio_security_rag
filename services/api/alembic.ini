# ASCII ONLY. Alembic doc file nay bang locale cua he thong (cp1252 tren Windows),
# nen ky tu tieng Viet co dau se lam `alembic upgrade` chet ngay khi doc config.
# Giai thich day du bang tieng Viet nam trong alembic/env.py (Python doc UTF-8 dung).

[alembic]
script_location = alembic
prepend_sys_path = .
# URL lay tu bien moi truong DATABASE_URL trong alembic/env.py -- KHONG ghi o day,
# vi file nay duoc commit con mat khau thi khong.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
